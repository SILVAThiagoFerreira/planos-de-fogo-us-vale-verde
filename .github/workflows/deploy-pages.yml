name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Download current Drive workbooks
        env:
          PREVISTO_ID: 1n8jSyMyRKJnxtF12kjf5LqqFjZUVJ2Y5
          REALIZADO_ID: 1lcbl-aQdmglzVNsk00LehVNZZkuDPHqm
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://drive.google.com/uc?export=download&id=${PREVISTO_ID}" \
            --output "$RUNNER_TEMP/Plano_Fogo_Previsto.xlsx"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://drive.google.com/uc?export=download&id=${REALIZADO_ID}" \
            --output "$RUNNER_TEMP/Plano_Fogo_Realizado.xlsx"

      - name: Build dashboard data
        run: |
          python scripts/build_data.py \
            --previsto "$RUNNER_TEMP/Plano_Fogo_Previsto.xlsx" \
            --realizado "$RUNNER_TEMP/Plano_Fogo_Realizado.xlsx" \
            --output data

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
